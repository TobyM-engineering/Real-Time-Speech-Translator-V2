<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1120" width="760" height="1120" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<style>
  .bg{fill:#0f1116}
  .ts{fill:#9aa3b2;font-size:16px}
  .tt{fill:#e6e8ee;font-size:21px;font-weight:600}
  .sub{fill:#9aa3b2;font-size:16px}
  .lbl{fill:#e6e8ee;font-size:17px;font-weight:600}
  .pw{stroke:#e05561;stroke-width:3;fill:none}
  .ain{stroke:#4ea1ff;stroke-width:3;fill:none}
  .aout{stroke:#4caf7d;stroke-width:3;fill:none}
  .disp{stroke:#9b7fd4;stroke-width:3;fill:none}
  .data{stroke:#d8a534;stroke-width:3;fill:none}
  .wl{stroke-dasharray:7 5}
  .cpw{fill:#e05561;font-size:16px;font-weight:600}
  .cain{fill:#4ea1ff;font-size:16px;font-weight:600}
  .caout{fill:#4caf7d;font-size:16px;font-weight:600}
  .cdisp{fill:#9b7fd4;font-size:16px;font-weight:600}
  .cdata{fill:#d8a534;font-size:16px;font-weight:600}
  .note{fill:#6a7078;font-size:16px}
</style>
<rect class="bg" width="760" height="1120"/>
<text class="tt" x="32" y="40">Connection diagram</text>
<text class="sub" x="32" y="64">Every physical link, and what it carries. No discrete GPIO wiring: each line is a</text>
<text class="sub" x="32" y="84">connector, a ribbon, a contact, or a radio link.</text>

<!-- legend, two rows so nothing crowds -->
<g transform="translate(32,108)">
  <line class="pw" x1="0" y1="6" x2="30" y2="6"/><text class="cpw" x="38" y="11">power</text>
  <line class="ain" x1="130" y1="6" x2="160" y2="6"/><text class="cain" x="168" y="11">audio in</text>
  <line class="aout" x1="280" y1="6" x2="310" y2="6"/><text class="caout" x="318" y="11">audio out</text>
  <line class="disp" x1="0" y1="34" x2="30" y2="34"/><text class="cdisp" x="38" y="39">display + touch</text>
  <line class="data" x1="190" y1="34" x2="220" y2="34"/><text class="cdata" x="228" y="39">data</text>
  <line class="aout wl" x1="330" y1="34" x2="360" y2="34"/><text class="note" x="368" y="39">dashed = wireless</text>
</g>

<!-- ===== power sources ===== -->
<rect x="32" y="196" width="320" height="84" rx="8" fill="#3a1f22" stroke="#e05561" stroke-width="2"/>
<text class="lbl" x="52" y="226">Mains supply</text>
<text class="ts" x="52" y="250">RasTech 27 W GaN PD</text>
<text class="ts" x="52" y="270">5.1 V / 5 A</text>

<rect x="408" y="196" width="320" height="84" rx="8" fill="#3a1f22" stroke="#e05561" stroke-width="2"/>
<text class="lbl" x="428" y="226">4 × 21700 cells</text>
<text class="ts" x="428" y="250">4S pack, 16.49 V charged</text>
<text class="ts" x="428" y="270">seated in the HAT</text>

<!-- ===== UPS HAT ===== -->
<rect x="150" y="366" width="460" height="104" rx="8" fill="#3a1f22" stroke="#e05561" stroke-width="2"/>
<text class="lbl" x="172" y="398">UPS HAT (E)</text>
<text class="ts" x="172" y="424">Charges the pack and powers the Pi at</text>
<text class="ts" x="172" y="446">the same time. Fuel gauge at I²C 0x2d.</text>

<path class="pw" d="M192 280 L192 366"/>
<text class="cpw" x="204" y="320">USB-C in</text>
<path class="pw" d="M568 280 L568 366"/>
<text class="cpw" x="452" y="320" text-anchor="end">cell holders</text>

<!-- ===== Pi 5 ===== -->
<rect x="150" y="560" width="460" height="104" rx="8" fill="#141e18" stroke="#4caf7d" stroke-width="2"/>
<text class="lbl" x="172" y="592">Raspberry Pi 5</text>
<text class="ts" x="172" y="618">Four A76 cores. Bluetooth radio on</text>
<text class="ts" x="172" y="640">UART — onboard, not a USB dongle.</text>

<path class="pw" d="M240 470 L240 560"/>
<text class="cpw" x="252" y="500">power</text>
<text class="cpw" x="252" y="520">pogo pins</text>
<path class="data" d="M520 470 L520 560"/>
<text class="cdata" x="508" y="500" text-anchor="end">I²C bus 1</text>
<text class="cdata" x="508" y="520" text-anchor="end">battery state</text>

<!-- ===== display ===== -->
<rect x="32" y="746" width="320" height="104" rx="8" fill="#241d33" stroke="#9b7fd4" stroke-width="2"/>
<text class="lbl" x="52" y="778">Touch Display 2, 5″</text>
<text class="ts" x="52" y="802">720 × 1280, two rotated halves</text>
<text class="ts" x="52" y="824">Goodix capacitive touch</text>

<path class="disp" d="M120 664 L120 700 L120 746"/>
<text class="cdisp" x="32" y="694">DSI ribbon · CAM/DISP 0</text>
<text class="cdisp" x="32" y="714">pixels out, touch back</text>
<path class="pw" d="M300 664 L300 746"/>
<text class="cpw" x="312" y="700">5 V pin 2</text>
<text class="cpw" x="312" y="720">GND pin 6</text>

<!-- ===== DJI receiver ===== -->
<rect x="408" y="746" width="320" height="104" rx="8" fill="#132133" stroke="#4ea1ff" stroke-width="2"/>
<text class="lbl" x="428" y="778">DJI USB receiver</text>
<text class="ts" x="428" y="802">One device, stereo, sample-synced</text>
<text class="ts" x="428" y="824">FL = Person A · FR = Person B</text>

<path class="ain" d="M568 664 L568 746"/>
<text class="cain" x="580" y="700">USB 2.0 port</text>
<text class="cain" x="580" y="720">480 Mbps hub</text>

<!-- transmitters -->
<rect x="408" y="916" width="150" height="80" rx="8" fill="#132133" stroke="#4ea1ff" stroke-width="2"/>
<text class="lbl" x="428" y="948">TX1</text>
<text class="ts" x="428" y="972">black</text>
<rect x="578" y="916" width="150" height="80" rx="8" fill="#132133" stroke="#4ea1ff" stroke-width="2"/>
<text class="lbl" x="598" y="948">TX2</text>
<text class="ts" x="598" y="972">grey</text>
<path class="ain wl" d="M483 916 L483 850"/>
<path class="ain wl" d="M653 916 L653 850"/>
<text class="cain" x="568" y="888" text-anchor="middle">wireless</text>

<!-- ===== AirPods ===== -->
<rect x="32" y="916" width="320" height="80" rx="8" fill="#141e18" stroke="#4caf7d" stroke-width="2"/>
<text class="lbl" x="52" y="948">AirPods Pro</text>
<text class="ts" x="52" y="972">One sink, hard-panned L / R</text>
<path class="aout wl" d="M192 850 L192 916"/>
<text class="caout" x="32" y="882">Bluetooth A2DP</text>

<!-- ===== RTC ===== -->
<rect x="408" y="1032" width="320" height="64" rx="8" fill="#181b23" stroke="#3a4152" stroke-width="2" stroke-dasharray="6 5"/>
<text class="lbl" x="428" y="1060">RTC coin cell</text>
<text class="ts" x="428" y="1082">JST at BAT — on hand, NOT fitted</text>
<path d="M120 850 L120 1064 L408 1064" stroke="#3a4152" stroke-width="2.5" fill="none" stroke-dasharray="6 5"/>
<text class="note" x="140" y="1040">clock backup</text>
</svg>
