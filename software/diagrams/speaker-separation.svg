<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<style>
  .bg{fill:#0f1116}
  .t{fill:#e6e8ee;font-size:16px}
  .ts{fill:#9aa3b2;font-size:14px}
  .tt{fill:#e6e8ee;font-size:18px;font-weight:600}
  .lbl{fill:#e6e8ee;font-size:15px;font-weight:600}
  .axis{stroke:#5a6478;stroke-width:1.5}
  .tick{stroke:#3a4152;stroke-width:1}
</style>
<rect class="bg" width="880" height="470"/>
<text class="tt" x="24" y="30">Speaker separation — cross-channel energy ratio</text>
<text class="ts" x="24" y="48">How loud this channel is versus the other, for the same instant. Loudness alone is never used.</text>

<!-- scale bar -->
<rect x="80" y="86" width="220" height="54" rx="5" fill="#3a1f22" stroke="#e05561" stroke-width="1.5"/>
<rect x="300" y="86" width="200" height="54" rx="5" fill="#332a16" stroke="#d8a534" stroke-width="1.5"/>
<rect x="500" y="86" width="300" height="54" rx="5" fill="#14261c" stroke="#4caf7d" stroke-width="1.5"/>

<text class="lbl" x="100" y="108" fill="#e05561">DROP — bleed</text>
<text class="ts" x="100" y="126">the other person's voice</text>
<text class="lbl" x="322" y="108" fill="#d8a534">AMBIGUOUS</text>
<text class="ts" x="322" y="126">both talking, or a bystander</text>
<text class="lbl" x="522" y="108" fill="#4caf7d">ACCEPT — this wearer</text>
<text class="ts" x="522" y="126">their own microphone dominates</text>

<!-- axis -->
<line class="axis" x1="80" y1="160" x2="800" y2="160"/>
<g class="tick">
  <line x1="80" y1="160" x2="80" y2="168"/><line x1="190" y1="160" x2="190" y2="168"/>
  <line x1="300" y1="160" x2="300" y2="172"/><line x1="400" y1="160" x2="400" y2="168"/>
  <line x1="500" y1="160" x2="500" y2="172"/><line x1="650" y1="160" x2="650" y2="168"/>
  <line x1="800" y1="160" x2="800" y2="168"/>
</g>
<text class="ts" x="70" y="186">−20 dB</text>
<text class="ts" x="282" y="186">−6 dB</text>
<text class="ts" x="392" y="186">0 dB</text>
<text class="ts" x="484" y="186">+6 dB</text>
<text class="ts" x="640" y="186">+15 dB</text>
<text class="ts" x="786" y="186">+25</text>
<text class="lbl" x="252" y="204" fill="#d8a534">RATIO_ACCEPT_DB threshold, both sides</text>

<!-- measured ranges -->
<text class="lbl" x="24" y="248">What the hardware actually measures</text>
<line x1="115" y1="272" x2="196" y2="272" stroke="#e05561" stroke-width="8" stroke-linecap="round"/>
<text class="ts" x="205" y="277">bleed from the other wearer: −15 to −17 dB</text>
<line x1="546" y1="300" x2="720" y2="300" stroke="#4caf7d" stroke-width="8" stroke-linecap="round"/>
<text class="ts" x="205" y="305">a wearer speaking into their own mic: +10 to +18 dB</text>
<text class="ts" x="24" y="330">The two populations are ~25 dB apart, which is why a fixed ±6 dB threshold works and why loudness is unnecessary.</text>

<!-- deferral -->
<rect x="300" y="356" width="200" height="44" rx="5" fill="#241d33" stroke="#9b7fd4" stroke-width="1.5"/>
<rect x="400" y="356" width="100" height="44" rx="5" fill="#2c2545" stroke="#9b7fd4" stroke-width="1.5"/>
<text class="lbl" x="316" y="374" fill="#9b7fd4">the ambiguous band, split</text>
<text class="ts" x="316" y="392">−6…0 dropped</text>
<text class="ts" x="412" y="392">0…+6 queued</text>

<text class="ts" x="24" y="428">Only the NON-negative half is queued for decoding after the dominant speaker stops. Below 0 dB the other person's voice is the louder one on</text>
<text class="ts" x="24" y="444">this microphone — deferring it once decoded one person's Spanish on the other's channel and played it back into her own ear.</text>
<text class="ts" x="24" y="462">Not solvable here: a bystander leaning into someone's microphone is genuinely dominant and passes every test. Per-person mute is the only defence.</text>
</svg>
