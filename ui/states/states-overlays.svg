<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<style>
  .bg{fill:#0f1116}
  .cap{fill:#e6e8ee;font-size:13px;font-weight:600}
  .sub{fill:#9aa3b2;font-size:11px}
  .tt{fill:#e6e8ee;font-size:15px;font-weight:600}
  .word{font-weight:700;font-size:22px}
  .chip{fill:#26FFFFFF}
  .chiptx{fill:#ffffff;font-size:11px;font-weight:700}
</style>
<rect class="bg" width="980" height="500"/>
<text class="tt" x="24" y="28">Overlays and device-level states</text>
<text class="sub" x="24" y="46">Things that cover a half, or the whole screen, rather than colouring it.</text>

<!-- 9 · language picker -->
<g transform="translate(40,70)">
  <rect x="0" y="0" width="220" height="392" rx="8" fill="#000"/>
  <rect x="4" y="4" width="212" height="190" rx="4" fill="#101216"/>
  <g transform="rotate(180 110 99)">
    <rect x="12" y="12" width="66" height="24" rx="5" class="chip"/><text class="chiptx" x="22" y="28">🇬🇧 English</text>
    <circle cx="110" cy="86" r="23" fill="none" stroke="#3A3D42" stroke-width="3.4"/>
    <text class="word" x="110" y="140" fill="#3A3D42" text-anchor="middle">Ready</text>
  </g>
  <rect x="4" y="194" width="212" height="4" fill="#000"/><circle cx="110" cy="196" r="2.2" fill="#2EE6A8"/>
  <!-- picker covering the bottom half -->
  <rect x="4" y="198" width="212" height="190" rx="4" fill="#0E1013"/>
  <g font-size="9">
    <rect x="10" y="204" width="98" height="36" rx="4" fill="#1B2A22" stroke="#2EE6A8" stroke-width="1.2"/>
    <text x="18" y="220" fill="#fff" font-size="10">🇪🇸 Español</text><text x="18" y="233" fill="#2EE6A8">✓ 7%</text>
    <rect x="112" y="204" width="98" height="36" rx="4" fill="#181B23" stroke="#3A4152"/>
    <text x="120" y="220" fill="#fff" font-size="10">🇬🇧 English</text><text x="120" y="233" fill="#2EE6A8">✓ 6%</text>
    <rect x="10" y="244" width="98" height="36" rx="4" fill="#181B23" stroke="#3A4152"/>
    <text x="18" y="260" fill="#fff" font-size="10">🇵🇹 Português</text><text x="18" y="273" fill="#2EE6A8">✓ 9%</text>
    <rect x="112" y="244" width="98" height="36" rx="4" fill="#181B23" stroke="#3A4152"/>
    <text x="120" y="260" fill="#fff" font-size="10">🇩🇪 Deutsch</text><text x="120" y="273" fill="#2EE6A8">✓ 11%</text>
    <rect x="10" y="284" width="98" height="36" rx="4" fill="#181B23" stroke="#3A4152"/>
    <text x="18" y="300" fill="#fff" font-size="10">🇫🇷 Français</text><text x="18" y="313" fill="#F5C542">13%</text>
    <rect x="112" y="284" width="98" height="36" rx="4" fill="#181B23" stroke="#3A4152"/>
    <text x="120" y="300" fill="#fff" font-size="10">🇮🇹 Italiano</text><text x="120" y="313" fill="#F5C542">9%</text>
    <rect x="10" y="324" width="98" height="36" rx="4" fill="#181B23" stroke="#3A4152"/>
    <text x="18" y="340" fill="#fff" font-size="10">🇮🇳 हिन्दी</text><text x="18" y="353" fill="#FF5A6E">41%</text>
    <rect x="112" y="324" width="98" height="36" rx="4" fill="#181B23" stroke="#3A4152"/>
    <text x="120" y="340" fill="#fff" font-size="10">🇧🇩 বাংলা</text><text x="120" y="353" fill="#FF5A6E">46%</text>
  </g>
  <text x="110" y="378" fill="#6A7078" font-size="8" text-anchor="middle">▼ 43 more, worse as you scroll</text>
  <text class="cap" x="0" y="412">9 · Language picker open</text>
  <text class="sub" x="0" y="428">Tap the chip. Two columns, ordered</text>
  <text class="sub" x="0" y="442">by accuracy; ✓ = bench-verified.</text>
</g>

<!-- 10 · level panel -->
<g transform="translate(280,70)">
  <rect x="0" y="0" width="220" height="392" rx="8" fill="#000"/>
  <rect x="4" y="4" width="212" height="384" rx="4" fill="#0E1013"/>
  <text x="110" y="40" fill="#e6e8ee" font-size="12" font-weight="700" text-anchor="middle">Microphone check</text>
  <!-- meter A -->
  <text x="18" y="72" fill="#C7CBD1" font-size="10">A · black windscreen</text>
  <text x="196" y="72" fill="#2EE6A8" font-size="10" text-anchor="end">−22.4 dBFS</text>
  <rect x="18" y="80" width="184" height="14" rx="3" fill="#181B23"/>
  <rect x="18" y="80" width="126" height="14" rx="3" fill="#2EE6A8"/>
  <rect x="128" y="76" width="2" height="22" fill="#F5C542"/>
  <text x="18" y="108" fill="#6A7078" font-size="7">−60</text><text x="82" y="108" fill="#6A7078" font-size="7">−40</text>
  <text x="146" y="108" fill="#6A7078" font-size="7">−20</text><text x="186" y="108" fill="#6A7078" font-size="7">0 dBFS</text>
  <!-- meter B -->
  <text x="18" y="140" fill="#C7CBD1" font-size="10">B · grey windscreen</text>
  <text x="196" y="140" fill="#2EE6A8" font-size="10" text-anchor="end">−24.1 dBFS</text>
  <rect x="18" y="148" width="184" height="14" rx="3" fill="#181B23"/>
  <rect x="18" y="148" width="118" height="14" rx="3" fill="#2EE6A8"/>
  <rect x="128" y="144" width="2" height="22" fill="#F5C542"/>
  <text x="18" y="188" fill="#9aa3b2" font-size="9">background −46 dBFS · gap 22 dB</text>
  <text x="18" y="204" fill="#2EE6A8" font-size="9">Both microphones look healthy.</text>
  <!-- battery detail -->
  <text x="18" y="240" fill="#C7CBD1" font-size="10">Battery</text>
  <text x="196" y="240" fill="#2EE6A8" font-size="10" text-anchor="end">100% · charging</text>
  <text x="110" y="370" fill="#6A7078" font-size="9" text-anchor="middle">tap anywhere to close</text>
  <text class="cap" x="0" y="412">10 · Level panel</text>
  <text class="sub" x="0" y="428">Tap the centre dot. Live meters,</text>
  <text class="sub" x="0" y="442">the verified band marked, battery.</text>
</g>

<!-- 11 · fault pill -->
<g transform="translate(520,70)">
  <rect x="0" y="0" width="220" height="392" rx="8" fill="#000"/>
  <rect x="4" y="4" width="212" height="190" rx="4" fill="#101216"/>
  <g transform="rotate(180 110 99)">
    <rect x="12" y="12" width="66" height="24" rx="5" class="chip"/><text class="chiptx" x="22" y="28">🇬🇧 English</text>
    <circle cx="110" cy="86" r="23" fill="none" stroke="#3A3D42" stroke-width="3.4"/>
    <text class="word" x="110" y="140" fill="#3A3D42" text-anchor="middle">Ready</text>
  </g>
  <rect x="4" y="194" width="212" height="4" fill="#000"/><circle cx="110" cy="196" r="2.2" fill="#F5C542"/>
  <rect x="4" y="198" width="212" height="190" rx="4" fill="#101216"/>
  <rect x="12" y="206" width="66" height="24" rx="5" class="chip"/><text class="chiptx" x="22" y="222">🇪🇸 Español</text>
  <circle cx="110" cy="280" r="23" fill="none" stroke="#3A3D42" stroke-width="3.4"/>
  <text class="word" x="110" y="334" fill="#3A3D42" text-anchor="middle">Listo</text>
  <!-- pill straddling the centre, text both ways -->
  <rect x="16" y="160" width="188" height="72" rx="6" fill="#300A10" stroke="#FF5A6E" stroke-width="1.4"/>
  <g transform="rotate(180 110 179)"><text x="110" y="183" fill="#FFB4BC" font-size="11" font-weight="700" text-anchor="middle">Earbuds not connected</text></g>
  <text x="110" y="219" fill="#FFB4BC" font-size="11" font-weight="700" text-anchor="middle">Earbuds not connected</text>
  <text class="cap" x="0" y="412">11 · Device fault</text>
  <text class="sub" x="0" y="428">Sits over the centre, printed both</text>
  <text class="sub" x="0" y="442">ways up so either person can read it.</text>
</g>

<!-- 12 · hold to talk -->
<g transform="translate(760,70)">
  <rect x="0" y="0" width="220" height="392" rx="8" fill="#000"/>
  <rect x="4" y="4" width="212" height="190" rx="4" fill="#101216"/>
  <g transform="rotate(180 110 99)">
    <rect x="12" y="12" width="66" height="24" rx="5" class="chip"/><text class="chiptx" x="22" y="28">🇬🇧 English</text>
    <circle cx="110" cy="86" r="23" fill="none" stroke="#3A3D42" stroke-width="3.4"/>
    <text class="word" x="110" y="140" fill="#3A3D42" text-anchor="middle">Ready</text>
  </g>
  <rect x="4" y="194" width="212" height="4" fill="#000"/><circle cx="110" cy="196" r="2.2" fill="#2EE6A8"/>
  <rect x="4" y="198" width="212" height="190" rx="4" fill="#0E5040"/>
  <rect x="7" y="201" width="206" height="184" rx="3" fill="none" stroke="#2EE6A8" stroke-width="3"/>
  <rect x="12" y="206" width="66" height="24" rx="5" class="chip"/><text class="chiptx" x="22" y="222">🇪🇸 Español</text>
  <circle cx="110" cy="280" r="23" fill="#2EE6A8"/>
  <text class="word" x="110" y="334" fill="#2EE6A8" text-anchor="middle">Escuchando</text>
  <text class="cap" x="0" y="412">12 · Hold-to-talk active</text>
  <text class="sub" x="0" y="428">Press and hold your own half for 1 s.</text>
  <text class="sub" x="0" y="442">Bright frame, filled dot, claimed mic.</text>
</g>
</svg>
