<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<style>
  .bg{fill:#0f1116}
  .cap{fill:#e6e8ee;font-size:13px;font-weight:600}
  .sub{fill:#9aa3b2;font-size:11px}
  .tt{fill:#e6e8ee;font-size:15px;font-weight:600}
  .word{font-weight:700;font-size:22px}
  .chip{fill:#26FFFFFF}
  .chiptx{fill:#ffffff;font-size:11px;font-weight:700}
</style>
<rect class="bg" width="980" height="500"/>
<text class="tt" x="24" y="28">The four conversation states — one screen, two halves, top half rotated 180°</text>
<text class="sub" x="24" y="46">Drawn at one-third scale from signal_live.qml. Each half fills 720×634 px; the black centre strip is 12 px.</text>

<!-- ============ screen template used four times ============ -->
<g transform="translate(40,70)">
  <rect x="0" y="0" width="220" height="392" rx="8" fill="#000"/>
  <!-- top half (Person A, rotated 180) -->
  <rect x="4" y="4" width="212" height="190" rx="4" fill="#101216"/>
  <g transform="rotate(180 110 99)">
    <rect x="12" y="12" width="66" height="24" rx="5" class="chip"/><text class="chiptx" x="22" y="28">🇬🇧 English</text>
    <circle cx="188" cy="24" r="18" fill="#26FFFFFF"/><text x="181" y="30" font-size="15">🔇</text>
    <circle cx="110" cy="86" r="23" fill="none" stroke="#3A3D42" stroke-width="3.4"/>
    <text class="word" x="110" y="140" fill="#3A3D42" text-anchor="middle">Ready</text>
  </g>
  <!-- centre strip -->
  <rect x="4" y="194" width="212" height="4" fill="#000"/>
  <circle cx="110" cy="196" r="2.2" fill="#2EE6A8"/>
  <circle cx="81" cy="196" r="1.8" fill="#2EE6A8"/><circle cx="139" cy="196" r="1.8" fill="#2EE6A8"/>
  <!-- bottom half (Person B) -->
  <rect x="4" y="198" width="212" height="190" rx="4" fill="#101216"/>
  <rect x="12" y="206" width="66" height="24" rx="5" class="chip"/><text class="chiptx" x="22" y="222">🇪🇸 Español</text>
  <circle cx="188" cy="218" r="18" fill="#26FFFFFF"/><text x="181" y="224" font-size="15">🔇</text>
  <circle cx="110" cy="280" r="23" fill="none" stroke="#3A3D42" stroke-width="3.4"/>
  <text class="word" x="110" y="334" fill="#3A3D42" text-anchor="middle">Listo</text>
  <text class="cap" x="0" y="412">1 · Idle (ready)</text>
  <text class="sub" x="0" y="428">Both halves dark. Rings grey.</text>
  <text class="sub" x="0" y="442">Centre dot green = pipeline ready.</text>
</g>

<!-- ============ 2 · listening ============ -->
<g transform="translate(280,70)">
  <rect x="0" y="0" width="220" height="392" rx="8" fill="#000"/>
  <rect x="4" y="4" width="212" height="190" rx="4" fill="#101216"/>
  <g transform="rotate(180 110 99)">
    <rect x="12" y="12" width="66" height="24" rx="5" class="chip"/><text class="chiptx" x="22" y="28">🇬🇧 English</text>
    <circle cx="188" cy="24" r="18" fill="#26FFFFFF"/><text x="181" y="30" font-size="15">🔇</text>
    <circle cx="110" cy="86" r="23" fill="none" stroke="#3A3D42" stroke-width="3.4"/>
    <text class="word" x="110" y="140" fill="#3A3D42" text-anchor="middle">Ready</text>
  </g>
  <rect x="4" y="194" width="212" height="4" fill="#000"/>
  <circle cx="110" cy="196" r="2.2" fill="#2EE6A8"/>
  <rect x="4" y="198" width="212" height="190" rx="4" fill="#0B4030"/>
  <rect x="12" y="206" width="66" height="24" rx="5" class="chip"/><text class="chiptx" x="22" y="222">🇪🇸 Español</text>
  <circle cx="188" cy="218" r="18" fill="#26FFFFFF"/><text x="181" y="224" font-size="15">🔇</text>
  <circle cx="110" cy="280" r="23" fill="none" stroke="#2EE6A8" stroke-width="3.4"/>
  <text class="word" x="110" y="334" fill="#2EE6A8" text-anchor="middle">Escuchando</text>
  <text class="cap" x="0" y="412">2 · One person speaking</text>
  <text class="sub" x="0" y="428">That half turns green, ring green.</text>
  <text class="sub" x="0" y="442">Only the speaker's half lights.</text>
</g>

<!-- ============ 3 · translating, with transcript band ============ -->
<g transform="translate(520,70)">
  <rect x="0" y="0" width="220" height="392" rx="8" fill="#000"/>
  <rect x="4" y="4" width="212" height="190" rx="4" fill="#101216"/>
  <g transform="rotate(180 110 99)">
    <rect x="12" y="12" width="66" height="24" rx="5" class="chip"/><text class="chiptx" x="22" y="28">🇬🇧 English</text>
    <circle cx="110" cy="80" r="23" fill="none" stroke="#3A3D42" stroke-width="3.4"/>
    <text class="word" x="110" y="132" fill="#3A3D42" text-anchor="middle">Ready</text>
  </g>
  <rect x="4" y="194" width="212" height="4" fill="#000"/>
  <circle cx="110" cy="196" r="2.2" fill="#2EE6A8"/>
  <rect x="4" y="198" width="212" height="190" rx="4" fill="#413306"/>
  <rect x="12" y="206" width="66" height="24" rx="5" class="chip"/><text class="chiptx" x="22" y="222">🇪🇸 Español</text>
  <circle cx="110" cy="268" r="23" fill="none" stroke="#F5C542" stroke-width="3.4"/>
  <text class="word" x="110" y="318" fill="#F5C542" text-anchor="middle">Traduciendo</text>
  <!-- pending band -->
  <rect x="12" y="330" width="196" height="50" rx="4" fill="#61000000" stroke="#48FFFFFF" stroke-width="1"/>
  <text x="20" y="346" fill="#99FFFFFF" font-size="8">heard — tap to cancel</text>
  <text x="20" y="362" fill="#ffffff" font-size="11">¿Dónde está la estación?</text>
  <text x="196" y="348" fill="#ffffff" font-size="12">✕</text>
  <rect x="20" y="370" width="120" height="2" rx="1" fill="#F5C542"/>
  <text class="cap" x="0" y="412">3 · Translating</text>
  <text class="sub" x="0" y="428">Amber half. The transcript band is</text>
  <text class="sub" x="0" y="442">a cancel button; the bar drains.</text>
</g>

<!-- ============ 4 · both speaking ============ -->
<g transform="translate(760,70)">
  <rect x="0" y="0" width="220" height="392" rx="8" fill="#000"/>
  <rect x="4" y="4" width="212" height="190" rx="4" fill="#0B4030"/>
  <g transform="rotate(180 110 99)">
    <rect x="12" y="12" width="66" height="24" rx="5" class="chip"/><text class="chiptx" x="22" y="28">🇬🇧 English</text>
    <circle cx="110" cy="86" r="23" fill="none" stroke="#2EE6A8" stroke-width="3.4"/>
    <text class="word" x="110" y="140" fill="#2EE6A8" text-anchor="middle">Listening</text>
  </g>
  <rect x="4" y="194" width="212" height="4" fill="#000"/>
  <circle cx="110" cy="196" r="2.2" fill="#2EE6A8"/>
  <rect x="4" y="198" width="212" height="190" rx="4" fill="#0E2F52"/>
  <rect x="12" y="206" width="66" height="24" rx="5" class="chip"/><text class="chiptx" x="22" y="222">🇪🇸 Español</text>
  <circle cx="110" cy="280" r="23" fill="none" stroke="#5AB0FF" stroke-width="3.4"/>
  <text class="word" x="110" y="334" fill="#5AB0FF" text-anchor="middle">Hablando</text>
  <text class="cap" x="0" y="412">4 · Speaking (into this ear)</text>
  <text class="sub" x="0" y="428">Blue = a translation is playing</text>
  <text class="sub" x="0" y="442">into that person's earbud.</text>
</g>
</svg>
