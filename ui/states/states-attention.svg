<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<style>
  .bg{fill:#0f1116}
  .cap{fill:#e6e8ee;font-size:13px;font-weight:600}
  .sub{fill:#9aa3b2;font-size:11px}
  .tt{fill:#e6e8ee;font-size:15px;font-weight:600}
  .word{font-weight:700;font-size:22px}
  .chip{fill:#26FFFFFF}
  .chiptx{fill:#ffffff;font-size:11px;font-weight:700}
</style>
<rect class="bg" width="980" height="500"/>
<text class="tt" x="24" y="28">States that ask for attention</text>
<text class="sub" x="24" y="46">Muting, falling behind, both people talking at once, and a turn that produced no audio.</text>

<!-- 5 · muted -->
<g transform="translate(40,70)">
  <rect x="0" y="0" width="220" height="392" rx="8" fill="#000"/>
  <rect x="4" y="4" width="212" height="190" rx="4" fill="#101216"/>
  <g transform="rotate(180 110 99)">
    <rect x="12" y="12" width="66" height="24" rx="5" class="chip"/><text class="chiptx" x="22" y="28">🇬🇧 English</text>
    <circle cx="110" cy="86" r="23" fill="none" stroke="#3A3D42" stroke-width="3.4"/>
    <text class="word" x="110" y="140" fill="#3A3D42" text-anchor="middle">Ready</text>
  </g>
  <rect x="4" y="194" width="212" height="4" fill="#000"/><circle cx="110" cy="196" r="2.2" fill="#2EE6A8"/>
  <rect x="4" y="198" width="212" height="190" rx="4" fill="#2A0B0F"/>
  <rect x="12" y="206" width="66" height="24" rx="5" class="chip"/><text class="chiptx" x="22" y="222">🇪🇸 Español</text>
  <circle cx="188" cy="218" r="18" fill="#66FF5A6E"/><text x="181" y="224" font-size="15">🔇</text>
  <circle cx="110" cy="280" r="23" fill="none" stroke="#FF5A6E" stroke-width="3.4"/>
  <text class="word" x="110" y="334" fill="#FF5A6E" text-anchor="middle">Silenciado</text>
  <text class="cap" x="0" y="412">5 · Muted</text>
  <text class="sub" x="0" y="428">Red half, red ring, and the mute</text>
  <text class="sub" x="0" y="442">circle itself fills red.</text>
</g>

<!-- 6 · backlog / pause request -->
<g transform="translate(280,70)">
  <rect x="0" y="0" width="220" height="392" rx="8" fill="#000"/>
  <rect x="4" y="4" width="212" height="190" rx="4" fill="#101216"/>
  <g transform="rotate(180 110 99)">
    <rect x="12" y="12" width="66" height="24" rx="5" class="chip"/><text class="chiptx" x="22" y="28">🇬🇧 English</text>
    <circle cx="110" cy="86" r="23" fill="none" stroke="#3A3D42" stroke-width="3.4"/>
    <text class="word" x="110" y="140" fill="#3A3D42" text-anchor="middle">Ready</text>
  </g>
  <rect x="4" y="194" width="212" height="4" fill="#000"/><circle cx="110" cy="196" r="2.2" fill="#2EE6A8"/>
  <rect x="4" y="198" width="212" height="190" rx="4" fill="#5A1010"/>
  <rect x="12" y="206" width="66" height="24" rx="5" class="chip"/><text class="chiptx" x="22" y="222">🇪🇸 Español</text>
  <circle cx="110" cy="272" r="23" fill="none" stroke="#FF5A6E" stroke-width="3.4"/>
  <text x="110" y="316" fill="#FF5A6E" font-size="13" font-weight="700" text-anchor="middle">Por favor, espere —</text>
  <text x="110" y="332" fill="#FF5A6E" font-size="13" font-weight="700" text-anchor="middle">voy con retraso</text>
  <rect x="12" y="344" width="196" height="36" rx="4" fill="#61000000" stroke="#48FFFFFF" stroke-width="1"/>
  <text x="20" y="366" fill="#FF5A6E" font-size="10">≈ 31 s behind</text>
  <text class="cap" x="0" y="412">6 · Backlog — pause requested</text>
  <text class="sub" x="0" y="428">Amber at 15 s behind, red at 30 s,</text>
  <text class="sub" x="0" y="442">phrased in that person's language.</text>
</g>

<!-- 7 · overlap hint -->
<g transform="translate(520,70)">
  <rect x="0" y="0" width="220" height="392" rx="8" fill="#000"/>
  <rect x="4" y="4" width="212" height="190" rx="4" fill="#0B4030"/>
  <g transform="rotate(180 110 99)">
    <rect x="12" y="12" width="66" height="24" rx="5" class="chip"/><text class="chiptx" x="22" y="28">🇬🇧 English</text>
    <circle cx="110" cy="80" r="23" fill="none" stroke="#2EE6A8" stroke-width="3.4"/>
    <text class="word" x="110" y="130" fill="#2EE6A8" text-anchor="middle">Listening</text>
    <text x="110" y="152" fill="#F5C542" font-size="11" font-weight="700" text-anchor="middle">one at a time, please</text>
  </g>
  <rect x="4" y="194" width="212" height="4" fill="#000"/><circle cx="110" cy="196" r="2.2" fill="#2EE6A8"/>
  <rect x="4" y="198" width="212" height="190" rx="4" fill="#0B4030"/>
  <rect x="12" y="206" width="66" height="24" rx="5" class="chip"/><text class="chiptx" x="22" y="222">🇪🇸 Español</text>
  <circle cx="110" cy="274" r="23" fill="none" stroke="#2EE6A8" stroke-width="3.4"/>
  <text class="word" x="110" y="324" fill="#2EE6A8" text-anchor="middle">Escuchando</text>
  <text x="110" y="346" fill="#F5C542" font-size="11" font-weight="700" text-anchor="middle">de uno en uno, por favor</text>
  <text class="cap" x="0" y="412">7 · Both talking — overlap hint</text>
  <text class="sub" x="0" y="428">Both halves green, and both show</text>
  <text class="sub" x="0" y="442">the hint in their own language.</text>
</g>

<!-- 8 · gap notice -->
<g transform="translate(760,70)">
  <rect x="0" y="0" width="220" height="392" rx="8" fill="#000"/>
  <rect x="4" y="4" width="212" height="190" rx="4" fill="#101216"/>
  <g transform="rotate(180 110 99)">
    <rect x="12" y="12" width="66" height="24" rx="5" class="chip"/><text class="chiptx" x="22" y="28">🇬🇧 English</text>
    <circle cx="110" cy="70" r="23" fill="none" stroke="#3A3D42" stroke-width="3.4"/>
    <rect x="16" y="104" width="188" height="42" rx="4" fill="#1E1A0C" stroke="#F5C542" stroke-width="1"/>
    <text x="26" y="122" fill="#F5C542" font-size="13">⚠</text>
    <text x="42" y="122" fill="#F5C542" font-size="10">"¿cuánto cuestan?"</text>
    <text x="42" y="138" fill="#F5C542" font-size="9">not translated</text>
  </g>
  <rect x="4" y="194" width="212" height="4" fill="#000"/><circle cx="110" cy="196" r="2.2" fill="#2EE6A8"/>
  <rect x="4" y="198" width="212" height="190" rx="4" fill="#101216"/>
  <rect x="12" y="206" width="66" height="24" rx="5" class="chip"/><text class="chiptx" x="22" y="222">🇪🇸 Español</text>
  <circle cx="110" cy="280" r="23" fill="none" stroke="#3A3D42" stroke-width="3.4"/>
  <text class="word" x="110" y="334" fill="#3A3D42" text-anchor="middle">Listo</text>
  <text class="cap" x="0" y="412">8 · Nothing came through</text>
  <text class="sub" x="0" y="428">A soft two-tone marker sounds and</text>
  <text class="sub" x="0" y="442">the untranslated words are shown.</text>
</g>
</svg>
