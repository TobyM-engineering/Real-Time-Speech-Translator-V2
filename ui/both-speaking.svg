<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<title>Both speaking at once</title>
<rect width="720" height="1280" fill="black"/>
<g transform="rotate(180 360 317)"><rect x="0" y="0" width="720" height="634" fill="#0B4030"/>
<rect x="20" y="20" width="233" height="80" rx="16" fill="#26FFFFFF"/>
<text x="48" y="72" font-size="32" font-weight="700" fill="white">🇪🇸  Español</text>
<rect x="584" y="16" width="120" height="120" rx="60" fill="#26FFFFFF"/>
<text x="644" y="96" font-size="52" text-anchor="middle">🔇</text>
<circle cx="360" cy="232" r="69.5" fill="none" stroke="#2EE6A8" stroke-width="11" opacity="0.95"/>
<text x="360" y="463" font-size="92" font-weight="700" fill="white" text-anchor="middle" opacity="1.0">Escuchando</text>
<text x="360" y="610" font-size="30" font-weight="700" fill="#F5C542" text-anchor="middle">De uno en uno, por favor.</text></g>
<rect x="0" y="634" width="720" height="12" fill="black"/>
<circle cx="360" cy="640" r="7" fill="#2EE6A8"/>
<circle cx="264" cy="640" r="6" fill="#2EE6A8"/>
<circle cx="456" cy="640" r="6" fill="#2EE6A8"/>
<g transform="translate(0,646)"><rect x="0" y="0" width="720" height="634" fill="#0B4030"/>
<rect x="20" y="20" width="233" height="80" rx="16" fill="#26FFFFFF"/>
<text x="48" y="72" font-size="32" font-weight="700" fill="white">🇬🇧  English</text>
<rect x="584" y="16" width="120" height="120" rx="60" fill="#26FFFFFF"/>
<text x="644" y="96" font-size="52" text-anchor="middle">🔇</text>
<circle cx="360" cy="232" r="69.5" fill="none" stroke="#2EE6A8" stroke-width="11" opacity="0.95"/>
<text x="360" y="463" font-size="92" font-weight="700" fill="white" text-anchor="middle" opacity="1.0">Listening</text>
<text x="360" y="610" font-size="30" font-weight="700" fill="#F5C542" text-anchor="middle">One at a time, please.</text></g>
</svg>