<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<style>
  .bg{fill:#0f1116}
  .ts{fill:#9aa3b2;font-size:11px}
  .tt{fill:#e6e8ee;font-size:15px;font-weight:600}
  .lbl{fill:#e6e8ee;font-size:12px;font-weight:600}
  .h{fill:#e6e8ee;font-size:13px;font-weight:600}
  .tick{stroke:#3a4152;stroke-width:1}
  .lead{stroke:#5a6478;stroke-width:1}
</style>
<rect class="bg" width="880" height="470"/>
<text class="tt" x="24" y="30">Where 2.48 seconds actually goes</text>
<text class="ts" x="24" y="48">One measured English dialogue turn, end of speech to audio in the other ear, on a fast translation pair.</text>

<!-- axis -->
<g class="tick">
  <line x1="80" y1="90" x2="80" y2="200"/><line x1="370" y1="90" x2="370" y2="200"/>
  <line x1="660" y1="90" x2="660" y2="200"/>
</g>
<text class="ts" x="72" y="84">0 s</text><text class="ts" x="362" y="84">1 s</text><text class="ts" x="652" y="84">2 s</text>

<!-- stacked bar -->
<rect x="80"  y="100" width="180" height="52" fill="#332a16" stroke="#d8a534" stroke-width="1.5"/>
<rect x="260" y="100" width="58"  height="52" fill="#14261c" stroke="#4caf7d" stroke-width="1.5"/>
<rect x="318" y="100" width="145" height="52" fill="#332a16" stroke="#d8a534" stroke-width="1.5"/>
<rect x="463" y="100" width="20"  height="52" fill="#14261c" stroke="#4caf7d" stroke-width="1.5"/>
<rect x="483" y="100" width="20"  height="52" fill="#14261c" stroke="#4caf7d" stroke-width="1.5"/>
<rect x="503" y="100" width="267" height="52" fill="#332a16" stroke="#d8a534" stroke-width="1.5"/>
<rect x="770" y="100" width="17"  height="52" fill="#132133" stroke="#4ea1ff" stroke-width="1.5"/>

<!-- leaders + labels -->
<line class="lead" x1="170" y1="152" x2="170" y2="176"/>
<text class="lbl" x="122" y="192">0.62 s</text><text class="ts" x="104" y="208">endpoint silence</text>
<line class="lead" x1="289" y1="100" x2="289" y2="74"/>
<text class="lbl" x="266" y="66" fill="#4caf7d">0.20 s</text><text class="ts" x="252" y="52" fill="#4caf7d">recognise</text>
<line class="lead" x1="390" y1="152" x2="390" y2="176"/>
<text class="lbl" x="362" y="192">0.50 s</text><text class="ts" x="342" y="208">merge hold</text>
<line class="lead" x1="473" y1="100" x2="473" y2="74"/>
<text class="lbl" x="430" y="66" fill="#4caf7d">0.07 translate</text>
<line class="lead" x1="493" y1="152" x2="493" y2="230"/>
<text class="lbl" x="470" y="246" fill="#4caf7d">0.07 s synthesise</text>
<line class="lead" x1="636" y1="152" x2="636" y2="176"/>
<text class="lbl" x="600" y="192">0.92 s</text><text class="ts" x="570" y="208">cancel window</text>
<line class="lead" x1="778" y1="100" x2="778" y2="74"/>
<text class="lbl" x="756" y="66" fill="#4ea1ff">0.06</text><text class="ts" x="742" y="52" fill="#4ea1ff">to sink</text>

<!-- summary bars -->
<text class="h" x="24" y="292">The same 2.48 s, grouped by what it is</text>

<rect x="24" y="308" width="668" height="30" rx="4" fill="#332a16" stroke="#d8a534" stroke-width="1.5"/>
<text class="lbl" x="40" y="328">2.04 s — deliberate waiting (policy)</text>
<text class="ts" x="704" y="328">82%</text>

<rect x="24" y="346" width="111" height="30" rx="4" fill="#14261c" stroke="#4caf7d" stroke-width="1.5"/>
<text class="lbl" x="40" y="366" fill="#4caf7d">0.34 s — compute</text>
<text class="ts" x="704" y="366">14%</text>

<rect x="24" y="384" width="20" height="30" rx="4" fill="#132133" stroke="#4ea1ff" stroke-width="1.5"/>
<text class="ts" x="56" y="404" fill="#4ea1ff">0.06 s — transport (2%)</text>

<text class="ts" x="24" y="440">The models are not the bottleneck. The time is spent waiting to be certain the sentence ended, waiting for a possible continuation, and holding audio</text>
<text class="ts" x="24" y="456">long enough that a mis-hear can be cancelled before the other person hears it. Going faster means trading those rules away, not optimising code.</text>
</svg>
